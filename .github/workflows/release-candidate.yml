name: Release candidate

# A manual candidate run publishes candidate images only. It never tags a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version matching the application, e.g. v0.6.0-alpha'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version }}
      CANDIDATE: candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version before publishing any candidate
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo 'Dispatch a new candidate; partial reruns are not promotable'; exit 1; }
          python3 backend/release_artifacts.py version "$VERSION" "$GITHUB_SHA"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both architectures once and record their manifest digests
        run: |
          mkdir -p .dev/image-metadata
          for component in api web; do
            context=backend
            if [ "$component" = web ]; then context=frontend; fi
            docker buildx build "$context" --platform linux/amd64,linux/arm64 \
              --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg RELEASE_VERSION="$VERSION" \
              --tag "ghcr.io/deusmaximus/plamotrack-$component:$CANDIDATE" \
              --metadata-file ".dev/image-metadata/$component.json" --push
          done
      - name: Assemble the exact downloadable release files
        run: |
          API=$(jq -r '."containerimage.digest"' .dev/image-metadata/api.json)
          WEB=$(jq -r '."containerimage.digest"' .dev/image-metadata/web.json)
          DB=$(docker buildx imagetools inspect postgres:16 --format '{{json .Manifest.Digest}}' | jq -r .)
          python3 backend/release_artifacts.py bundle --out .dev/release-bundle \
            --version "$VERSION" --revision "$GITHUB_SHA" \
            --api "ghcr.io/deusmaximus/plamotrack-api@$API" \
            --web "ghcr.io/deusmaximus/plamotrack-web@$WEB" --db "postgres@$DB"
          python3 backend/release_artifacts.py verify .dev/release-bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: .dev/release-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: build
    uses: ./.github/workflows/ci.yml
    with:
      release_bundle: true
      runners: '["ubuntu-latest", "ubuntu-24.04-arm"]'
