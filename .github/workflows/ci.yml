name: CI

on:
  pull_request:
  push:
    branches: [main]

# A public pull request only needs to read the checkout. Keep the default token
# deliberately powerless beyond that.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://plamotrack:plamotrack@127.0.0.1:5432/plamotrack_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plamotrack
          POSTGRES_PASSWORD: plamotrack
          POSTGRES_DB: plamotrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plamotrack -d plamotrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Presentation only — enforcement is src/i18n/catalogue.test.ts, in Test.
      - name: Translation coverage report
        run: npm run i18n:report >> "$GITHUB_STEP_SUMMARY"

      - name: Type-check and build
        run: npm run build

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The packaged stack deliberately requires the same .env file a real
      # installation does. The runner is ephemeral and loopback-bound, so the
      # example's disposable password is appropriate here and, importantly,
      # reaches both Postgres and the API through the normal config path.
      - name: Prepare CI configuration
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_USER=.*/POSTGRES_USER=plamotrack_ci/' .env
          sed -i 's/^POSTGRES_DB=.*/POSTGRES_DB=plamotrack_ci/' .env
          sed -i 's/^POSTGRES_PORT=.*/POSTGRES_PORT=55432/' .env
          # A listed name for the ingress matrix's T3 rows (a name only
          # ALLOWED_HOSTS can supply answers; everything else is 421).
          echo 'ALLOWED_HOSTS=ci.plamotrack.test' >> .env

      - name: Validate packaged and development Compose configurations
        run: |
          python - <<'PY'
          import json
          import subprocess


          def compose_config(*files: str) -> dict:
              command = ["docker", "compose"]
              for file in files:
                  command.extend(("-f", file))
              command.extend(("config", "--format", "json"))
              return json.loads(subprocess.check_output(command, text=True))


          base = compose_config("docker-compose.yml")
          development = compose_config("docker-compose.yml", "docker-compose.dev.yml")

          assert not base["services"]["db"].get("ports"), base["services"]["db"]
          assert base["services"]["api"]["environment"]["POSTGRES_HOST"] == "db"
          assert base["services"]["api"]["environment"]["POSTGRES_PORT"] == "5432"
          assert base["services"]["migrate"]["environment"]["POSTGRES_PORT"] == "5432"
          # The ingress builds its Host allowlist from exactly these, and gets
          # nothing else — the web container has no business with the password.
          web_env = base["services"]["web"]["environment"]
          assert set(web_env) == {"PUBLIC_BASE_URL", "ALLOWED_HOSTS", "WEB_BIND"}, web_env
          assert web_env["ALLOWED_HOSTS"] == "ci.plamotrack.test", web_env

          [port] = development["services"]["db"]["ports"]
          assert port["host_ip"] == "127.0.0.1", port
          assert port["published"] == "55432", port
          assert port["target"] == 5432, port
          PY

      - name: Start Postgres
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db --wait

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run browser happy path
        working-directory: frontend
        run: npm run test:e2e

      # The run that fails is the one whose evidence is worth keeping, and until
      # this existed there was none: a red Integration job left a console excerpt
      # and nothing to tell a flake from a regression (#17). The report embeds the
      # retry's trace — DOM, network and a screenshot per step.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Exercise documented backup and restore commands
        run: |
          docker compose exec -T db sh -c 'exec pg_dump -U "$POSTGRES_USER" -Fc "$POSTGRES_DB"' > /tmp/plamotrack-ci.dump
          docker compose exec -T db sh -c 'exec pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean --if-exists' < /tmp/plamotrack-ci.dump

      - name: Build and start the packaged stack
        run: docker compose up -d --build --wait

      - name: Smoke-test the ingress
        run: |
          python - <<'PY'
          import json
          import subprocess


          output = subprocess.check_output(
              ["docker", "compose", "ps", "--format", "json"], text=True
          )
          try:
              parsed = json.loads(output)
              rows = parsed if isinstance(parsed, list) else [parsed]
          except json.JSONDecodeError:
              rows = [json.loads(line) for line in output.splitlines() if line.strip()]
          services = {
              row["Service"]: row for row in rows
          }
          assert not any(
              publisher["PublishedPort"]
              for publisher in services["db"].get("Publishers") or []
          ), services["db"].get("Publishers")
          published_web = [
              publisher
              for publisher in services["web"].get("Publishers") or []
              if publisher["PublishedPort"]
          ]
          assert published_web == [
              {
                  "URL": "127.0.0.1",
                  "TargetPort": 80,
                  "PublishedPort": 8080,
                  "Protocol": "tcp",
              }
          ], published_web
          PY
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/api/healthz > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/openapi.json > /dev/null

      # T2 (design notes §5.8): the ingress matrix against the packaged nginx —
      # the four rejected /api/ namespaces in their normalised spellings, the
      # canonical positives beside them, no Location anywhere but nginx's own
      # relative 301, the security headers, and T3's hostile Host / Origin and
      # listed-name rows at this layer.
      - name: Run the ingress matrix
        working-directory: backend
        run: uv run python ingress_matrix.py http://127.0.0.1:8080 --allowed-host ci.plamotrack.test

      - name: Smoke-test MCP through nginx
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import asyncio

          from fastmcp import Client


          async def check() -> None:
              async with Client("http://127.0.0.1:8080/mcp/") as client:
                  tools = await client.list_tools()
                  assert any(tool.name == "list_kits" for tool in tools)


          asyncio.run(check())
          PY

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose services
        if: always()
        run: docker compose down
