name: CI

on:
  pull_request:
  push:
    branches: [main]

# A public pull request only needs to read the checkout. Keep the default token
# deliberately powerless beyond that.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://plamotrack:plamotrack@127.0.0.1:5432/plamotrack_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plamotrack
          POSTGRES_PASSWORD: plamotrack
          POSTGRES_DB: plamotrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plamotrack -d plamotrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The packaged stack deliberately requires the same .env file a real
      # installation does. The runner is ephemeral and loopback-bound, so the
      # example's disposable password is appropriate here and, importantly,
      # reaches both Postgres and the API through the normal config path.
      - name: Prepare CI configuration
        run: cp .env.example .env

      - name: Start Postgres
        run: docker compose up -d db --wait

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run browser happy path
        working-directory: frontend
        run: npm run test:e2e

      - name: Build and start the packaged stack
        run: docker compose up -d --build --wait

      - name: Smoke-test the ingress
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/api/readyz > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/openapi.json > /dev/null

      - name: Smoke-test MCP through nginx
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import asyncio

          from fastmcp import Client


          async def check() -> None:
              async with Client("http://127.0.0.1:8080/mcp/") as client:
                  tools = await client.list_tools()
                  assert any(tool.name == "list_kits" for tool in tools)


          asyncio.run(check())
          PY

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose services
        if: always()
        run: docker compose down
