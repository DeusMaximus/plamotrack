<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The brand mark (components/BrandMark.tsx), the same geometry as the docs
         site's icon. Two files because the tab strip follows the *browser's*
         scheme, not the app's theme switch: the light accent on light chrome,
         the dark accent on dark. A browser that ignores `media` here takes the
         last link, the amber one, which reads on both. No <style> inside the
         SVGs: nginx serves them under `style-src 'self'` (design §5.6). -->
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>plamotrack</title>
    <!-- Blocking, before the bundle: the theme is on <html> before anything
         paints (design §13.1). public/theme.js says why it is not inline. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
