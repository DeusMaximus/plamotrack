# The full local stack (design notes §8). `docker compose up -d --build --wait`
# builds it, migrates the database, and leaves an instance on
# http://127.0.0.1:8080.
#
# `--build` is not optional. `api` and `migrate` share an `image:` tag below so
# they build once and run the same bits — which also means a plain `up` will reuse
# a stale local image after the source changes, and has run migrations it predated.
# A fresh LXC on the official Docker packages also failed a first `up` outright,
# saying it could not find the images in any registry, and the flag fixed that too;
# why that host refuses to build when a one-service probe on it builds fine is not
# understood. See AGENTS.md before theorising — several explanations have been
# written down and retracted.
#
# Only `web` is published. The API and the database stay on the compose network,
# so an instance has exactly one door, bound to loopback by default. That makes
# this a convenient local install and NOT an internet deployment — the browser
# needs the owner login (M6-3), REST scripts and MCP clients need a personal
# access token (M6-4), but there is no tested TLS path yet (rest of Milestone 6).
#
# Developing on it instead? Add `docker-compose.dev.yml` explicitly; it publishes
# only Postgres on loopback while the API and frontend run from source.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plamotrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-plamotrack}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plamotrack}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations run as their own step, to completion, before the API starts.
  # Doing it in the API's entrypoint instead would turn a failed migration into
  # a crash-looping API rather than a stopped deploy with a readable error.
  migrate:
    build: ./backend
    image: plamotrack-api:local
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file: .env
    environment:
      # Beats .env, which points the source-run API at the published dev port.
      # Containers always use db:5432 internally.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    image: plamotrack-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # The API port is unpublished; nginx overwrites this internal header on
      # every proxied path after resolving TRUSTED_PROXIES for rate limiting.
      PLAMOTRACK_BUNDLED_INGRESS: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /readyz, not /healthz: this has to fail while Postgres is unreachable,
      # or compose reports a stack healthy that can't serve a single request.
      # Written in python because the slim image has no curl and doesn't need one.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build: ./frontend
    image: plamotrack-web:local
    restart: unless-stopped
    environment:
      # The ingress builds its Host allowlist from these (frontend/nginx/), the
      # same keys the API reads from .env for its own copy of the check. Only
      # These identity/rate-limit inputs reach the web container — it has no
      # business with the database password.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      WEB_BIND: ${WEB_BIND:-127.0.0.1}
    ports:
      # The one published port. WEB_BIND decides who can connect; ALLOWED_HOSTS
      # decides which names the instance answers to (a request for any other
      # name is 421). The browser needs the owner login and MCP/REST automation
      # needs a personal access token, but there is no tested TLS path yet, so
      # keep this on a trusted network. Loopback by default; see "Reaching
      # it from another machine" in docs/operations.md before widening it, on Linux
      # where a published port is not covered by the host firewall.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
