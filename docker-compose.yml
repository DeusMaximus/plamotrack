# Dev stack — currently just the database.
# The api and frontend services land with Milestone 8 (packaging).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plamotrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-plamotrack}
    ports:
      # Host-side port only — the API finds it via POSTGRES_PORT, so changing
      # this one value moves both sides together.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plamotrack}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
