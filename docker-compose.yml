# Dev stack — currently just the database.
# The api and frontend services land with Milestone 5 (local installability).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plamotrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-plamotrack}
    ports:
      # Loopback only by default: the database is published for tooling on this
      # machine (the from-source API, psql, pytest), and nothing else needs to
      # reach it. Docker publishes on 0.0.0.0 if you omit the bind address,
      # which puts an unauthenticated-by-default service on your LAN.
      # Override POSTGRES_BIND only if you genuinely need remote access, and
      # set a real password first.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plamotrack}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
