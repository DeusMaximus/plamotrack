# Keycloak for the deployment gate — the #190 spike's fixture, told its public
# https name so the realm's issuer is https://idp.<name>/realms/plamotrack and
# every redirect it builds carries that origin. It listens on loopback only;
# Caddy (Caddyfile.test) fronts it. Never `down -v` this mid-phase: start-dev
# keeps its sessions in the container, and T13's link lives in one of them.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: plamotrack-gate-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-password
      KC_HOSTNAME: https://idp.${PLAMOTRACK_TEST_NAME:?set PLAMOTRACK_TEST_NAME}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/plamotrack HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'plamotrack' <&3"]
      interval: 5s
      timeout: 3s
      retries: 60
