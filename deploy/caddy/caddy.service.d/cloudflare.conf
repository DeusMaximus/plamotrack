# systemd drop-in for the packaged Caddy: /etc/systemd/system/caddy.service.d/cloudflare.conf
# Hands the DNS-01 token to Caddy from a root-only file, never from the
# Caddyfile or a shell history. Create the file as root:
#
#     install -m 0600 /dev/null /etc/caddy/cloudflare.env
#     printf 'CLOUDFLARE_API_TOKEN=%s\n' '<the token>' > /etc/caddy/cloudflare.env
#     systemctl daemon-reload && systemctl restart caddy
#
# The token needs one permission: Zone → DNS → Edit, on the zone the name is in.
[Service]
EnvironmentFile=/etc/caddy/cloudflare.env
