# systemd drop-in for the packaged Caddy: /etc/systemd/system/caddy.service.d/cloudflare.conf
# Hands the DNS-01 token to Caddy from a root-only file, never from the
# Caddyfile, a shell command line, or shell history. Create the file empty and
# add the one line in an editor, so the token is never an argument:
#
#     sudo install -m 0600 /dev/null /etc/caddy/cloudflare.env
#     sudo systemctl edit --stdin caddy   # or: sudoedit /etc/caddy/cloudflare.env
#     # in the editor, one line:  CLOUDFLARE_API_TOKEN=<the token>
#     sudo systemctl daemon-reload && sudo systemctl restart caddy
#
# The token needs TWO permissions on the zone the name is in — Zone → DNS → Edit
# and Zone → Zone → Read (the module reads the zone id before editing a record).
# Cloudflare's built-in "Edit zone DNS" token template grants exactly these two.
[Service]
EnvironmentFile=/etc/caddy/cloudflare.env
