[project]
name = "plamotrack-backend"
# Keep in step with app/__init__.py — that one is what /meta and the MCP
# handshake report, so a mismatch is visible to clients.
version = "0.4.0"
description = "plamotrack API + MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastmcp>=4.0",
    # The browser login (services/oidc.py) and the MCP OAuth proxy's provider-side
    # revocation own their HTTP client; FastMCP 4 no longer ships httpx (#241).
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # FastAPI needs it for the import file upload
    # IANA time-zone db shipped with the app (#23). zoneinfo consults the OS
    # database first and this as the fallback/union, so /settings accepts a
    # current zone list even on an image whose OS tzdata is absent or ancient.
    "tzdata>=2025.1",
    "argon2-cffi>=25.1.0",
    "joserfc>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
